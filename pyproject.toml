[tool.poetry]
name = "quizmind-ai"
version = "0.1.0"
description = "AI-powered competitive learning platform"
authors = ["QuizMind Dev"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
python-dotenv = "^1.0.0"
openai = "^1.0.0"
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langgraph = "^0.2.0"
redis = "^5.0.0"
celery = {extras = ["redis"], version = "^5.3.0"}
chromadb = "^0.5.0"
pandas = "^2.0.0"
plotly = "^5.0.0"
numpy = "^1.26.0"
reportlab = "^4.0.0"
streamlit = "^1.35.0"
httpx = "^0.27.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
aiosqlite = "^0.20.0"
ruff = "^0.4.0"
black = "^24.0.0"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
